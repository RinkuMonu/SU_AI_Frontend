<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="adBg" cx="70%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#041E2B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060913" stop-opacity="1" />
    </radialGradient>

    <!-- Cyan Megaphone Gradients -->
    <linearGradient id="megaBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="coneRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="growthLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="adShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Deep Background Base -->
  <rect width="420" height="240" fill="url(#adBg)" />

  <!-- Ambient Cyan Light Volumes -->
  <circle cx="310" cy="110" r="115" fill="#0EA5E9" opacity="0.32" filter="url(#cyanGlow)" />
  <circle cx="210" cy="50" r="80" fill="#06B6D4" opacity="0.2" filter="url(#cyanGlow)" />
  <circle cx="80" cy="170" r="75" fill="#0284C7" opacity="0.18" filter="url(#cyanGlow)" />

  <!-- Cyber Radar Target HUD Grid in Background -->
  <g transform="translate(305, 115)" opacity="0.22" stroke="#67E8F9" stroke-width="1.2">
    <!-- Concentric HUD Radar Circles -->
    <circle cx="0" cy="0" r="45" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="80" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="110" opacity="0.5" />
    <!-- Radar Crosshairs -->
    <line x1="-115" y1="0" x2="115" y2="0" stroke-dasharray="3 5" />
    <line x1="0" y1="-115" x2="0" y2="115" stroke-dasharray="3 5" />
  </g>

  <!-- 3D Exponential ROAS Surging Growth Curve -->
  <g filter="url(#softCyanGlow)">
    <path d="M 120 190 Q 210 180 250 115 T 385 30" stroke="url(#growthLineGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Glowing Arrowhead Surging into the Clouds -->
    <polygon points="385,30 372,36 380,44" fill="#34D399" />
    <!-- Gradient Shimmer area under the growth curve -->
    <path d="M 120 190 Q 210 180 250 115 T 385 30 L 385 190 Z" fill="url(#growthLineGrad)" opacity="0.06" />
  </g>

  <!-- 3D Digital Cyber Megaphone / Loudspeaker (Right Side) -->
  <g transform="translate(235, 30)" filter="url(#adShadow)">
    <!-- Back Light Aura -->
    <ellipse cx="60" cy="70" rx="65" ry="60" fill="#0284C7" opacity="0.35" filter="url(#softCyanGlow)" />

    <!-- Isometric Megaphone Horn Body -->
    <path d="M 45 60 L 110 25 L 110 115 L 45 80 Z" fill="url(#megaBodyGrad)" />
    
    <!-- Specular Highlight Top Edge of Horn -->
    <path d="M 46 60 L 110 25" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />

    <!-- Front Circular Acoustic Bell / Outer Rim -->
    <ellipse cx="110" cy="70" rx="14" ry="45" fill="#0284C7" stroke="url(#coneRingGrad)" stroke-width="2.5" />
    <ellipse cx="110" cy="70" rx="8" ry="34" fill="#0369A1" />
    <ellipse cx="110" cy="70" rx="4" ry="20" fill="#67E8F9" filter="url(#softCyanGlow)" />

    <!-- Megaphone Back Cylinder / Driver Housing -->
    <rect x="20" y="58" width="26" height="24" rx="4" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M 20 62 L 14 65 L 14 75 L 20 78 Z" fill="#075985" />

    <!-- Ergonomic Pistol Grip Handle -->
    <path d="M 32 82 L 24 125 L 36 127 L 44 82 Z" fill="#0369A1" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Grip Grooves -->
    <line x1="27" y1="96" x2="39" y2="98" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
    <line x1="26" y1="106" x2="38" y2="108" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
    <line x1="25" y1="116" x2="37" y2="118" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />

    <!-- Broadcasting Volumetric Sound Wave Arcs radiating forward -->
    <g stroke="#67E8F9" stroke-linecap="round" fill="none" filter="url(#softCyanGlow)">
      <path d="M 128 45 C 142 55 145 85 128 95" stroke-width="3" />
      <path d="M 142 32 C 164 48 168 92 142 108" stroke-width="2.5" opacity="0.85" />
      <path d="M 158 20 C 188 40 192 100 158 120" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    </g>
  </g>

  <!-- Left Side Floating 3D Target Reticle Orb -->
  <g transform="translate(138, 48)" filter="url(#adShadow)">
    <circle cx="22" cy="22" r="22" fill="#0284C7" />
    <circle cx="22" cy="22" r="21" stroke="#A5F3FC" stroke-opacity="0.75" stroke-width="1.5" fill="none" />
    <!-- Target Concentric Rings -->
    <circle cx="22" cy="22" r="14" stroke="#FFFFFF" stroke-width="1.8" fill="none" filter="url(#softCyanGlow)" />
    <circle cx="22" cy="22" r="7" stroke="#38BDF8" stroke-width="1.5" fill="none" />
    <circle cx="22" cy="22" r="3" fill="#FFFFFF" />
  </g>

  <!-- Floating Conversion Metric Pill -->
  <g transform="translate(112, 115)" filter="url(#adShadow)">
    <rect x="0" y="0" width="60" height="22" rx="11" fill="#041E2B" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Mini green upward bar chart -->
    <rect x="15" y="13" width="4" height="5" rx="1" fill="#34D399" />
    <rect x="22" y="9" width="4" height="9" rx="1" fill="#34D399" />
    <rect x="29" y="6" width="4" height="12" rx="1" fill="#34D399" />
    <!-- Green Sparkle -->
    <circle cx="43" cy="11" r="2.5" fill="#34D399" filter="url(#softCyanGlow)" />
  </g>

  <!-- Radiant Cyan Sparkles -->
  <g fill="#A5F3FC" filter="url(#softCyanGlow)">
    <path d="M 85 55 Q 92 55 92 48 Q 92 55 99 55 Q 92 55 92 62 Q 92 55 85 55 Z" />
    <path d="M 225 130 Q 230 130 230 125 Q 230 130 235 130 Q 230 130 230 135 Q 230 130 225 130 Z" fill="#38BDF8" />
    <path d="M 390 35 Q 395 35 395 30 Q 395 35 400 35 Q 395 35 395 40 Q 395 35 390 35 Z" fill="#FFFFFF" />
  </g>

  <!-- Cyan Crosshairs -->
  <path d="M 60 115 L 60 127 M 54 121 L 66 121" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <path d="M 395 160 L 395 172 M 389 166 L 401 166" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
</svg>
