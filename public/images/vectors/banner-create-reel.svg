<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="reelBg" cx="70%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#4C0519" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#270512" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080713" stop-opacity="1" />
    </radialGradient>

    <!-- Phone Glass & Metal Gradients -->
    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0616" />
      <stop offset="100%" stop-color="#120208" />
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E11D48" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FDA4AF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="videoScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="50%" stop-color="#831843" />
      <stop offset="100%" stop-color="#1E0514" />
    </linearGradient>

    <linearGradient id="playSphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="40%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="roseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softPinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="420" height="240" fill="url(#reelBg)" />

  <!-- Ambient Light Volumes -->
  <circle cx="310" cy="110" r="115" fill="#E11D48" opacity="0.32" filter="url(#roseGlow)" />
  <circle cx="200" cy="50" r="80" fill="#F43F5E" opacity="0.2" filter="url(#roseGlow)" />
  <circle cx="80" cy="180" r="75" fill="#BE123C" opacity="0.18" filter="url(#roseGlow)" />

  <!-- Cinematic Vertical Motion Beams -->
  <path d="M 270 -20 L 330 260 L 310 260 L 250 -20 Z" fill="#FB7185" opacity="0.07" />
  <path d="M 330 -20 L 390 260 L 375 260 L 315 -20 Z" fill="#FDA4AF" opacity="0.05" />

  <!-- 3D Floating Curved-Glass Smartphone (Positioned on the Right Side) -->
  <g transform="translate(245, 14)" filter="url(#phoneShadow)">
    <!-- Back Glow Glow Plate -->
    <rect x="5" y="8" width="124" height="194" rx="24" fill="#9F1239" opacity="0.4" filter="url(#softPinkGlow)" />

    <!-- Smartphone Body Case -->
    <rect x="0" y="0" width="124" height="194" rx="24" fill="url(#phoneBodyGrad)" stroke="url(#phoneBorder)" stroke-width="1.8" />

    <!-- Glass Specular Highlight Curve -->
    <path d="M 24 1.8 L 100 1.8 C 112 1.8 122 10 122.2 22" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Smartphone Display Screen -->
    <rect x="6" y="6" width="112" height="182" rx="19" fill="url(#videoScreenGrad)" />

    <!-- Dynamic Island / Top Camera Notch -->
    <rect x="42" y="11" width="40" height="7" rx="3.5" fill="#000000" />
    <circle cx="74" cy="14.5" r="2" fill="#1E293B" />
    <circle cx="74" cy="14.5" r="0.8" fill="#38BDF8" />

    <!-- Video Reel Content Graphics -->
    <g transform="translate(6, 6)">
      <!-- Cinematic Stage Spotlight Cones -->
      <path d="M 56 18 L 12 140 L 100 140 Z" fill="#FDA4AF" opacity="0.15" />

      <!-- Stylized AI Hologram Persona in Reel Video -->
      <g transform="translate(42, 48)">
        <!-- Head -->
        <circle cx="14" cy="14" r="10" fill="#FECDD3" />
        <!-- Body / Dress Silhouette -->
        <path d="M 4 55 C 4 36 10 30 14 30 C 18 30 24 36 24 55 Z" fill="#FDA4AF" opacity="0.9" />
        <path d="M 0 55 C 2 40 8 34 14 34 C 20 34 26 40 28 55 Z" fill="#FFE4E6" opacity="0.75" />
      </g>

      <!-- Center Floating Play Button (Frosted Glass with 3D Sphere) -->
      <g transform="translate(38, 70)" filter="url(#softPinkGlow)">
        <circle cx="18" cy="18" r="18" fill="url(#playSphereGrad)" opacity="0.95" />
        <circle cx="18" cy="18" r="17" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" fill="none" />
        <!-- Play Triangle -->
        <polygon points="14,10 26,18 14,26" fill="#FFFFFF" />
      </g>

      <!-- Right Edge Engagement Action Icons -->
      <g transform="translate(90, 68)">
        <!-- Like Heart -->
        <path d="M 4 4 C 4 2 6.5 0.5 8 2.5 C 9.5 0.5 12 2 12 4 C 12 7 8 9.5 8 9.5 C 8 9.5 4 7 4 4 Z" fill="#F43F5E" filter="url(#softPinkGlow)" />
        <rect x="3" y="11" width="10" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.8" />

        <!-- Comment Bubble -->
        <circle cx="8" cy="22" r="4.5" fill="#FFFFFF" opacity="0.9" />
        <rect x="3" y="28" width="10" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.8" />

        <!-- Share Arrow -->
        <path d="M 5 37 L 11 40 L 5 43 L 7 40 Z" fill="#FFFFFF" opacity="0.9" />

        <!-- Rotating Audio Vinyl Disc -->
        <g transform="translate(8, 56)">
          <circle cx="0" cy="0" r="7.5" fill="#1E0514" stroke="#FB7185" stroke-width="1.2" />
          <circle cx="0" cy="0" r="3" fill="#E11D48" />
          <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
        </g>
      </g>

      <!-- Dynamic Audio Waveform Equalizer at Bottom -->
      <g transform="translate(14, 138)" fill="#FFF1F2">
        <rect x="0" y="8" width="3" height="12" rx="1.5" />
        <rect x="6" y="2" width="3" height="18" rx="1.5" />
        <rect x="12" y="6" width="3" height="14" rx="1.5" />
        <rect x="18" y="0" width="3" height="20" rx="1.5" />
        <rect x="24" y="5" width="3" height="15" rx="1.5" />
        <rect x="30" y="10" width="3" height="10" rx="1.5" />
        <rect x="36" y="3" width="3" height="17" rx="1.5" />
        <rect x="42" y="8" width="3" height="12" rx="1.5" />
      </g>

      <!-- Red Video Progress Bar -->
      <rect x="12" y="166" width="88" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.3" />
      <rect x="12" y="166" width="56" height="2.5" rx="1.25" fill="#F43F5E" />
      <circle cx="68" cy="167.25" r="2.5" fill="#FFFFFF" filter="url(#softPinkGlow)" />
    </g>
  </g>

  <!-- Left Side Floating 3D Music Note Glass Bubble -->
  <g transform="translate(138, 48)" filter="url(#phoneShadow)">
    <circle cx="22" cy="22" r="22" fill="#E11D48" />
    <circle cx="22" cy="22" r="21" stroke="#FECDD3" stroke-opacity="0.7" stroke-width="1.5" fill="none" />
    <!-- 3D Musical Double Note -->
    <path d="M 17 26 C 15 26 13.5 24.5 13.5 23 C 13.5 21.5 15 20 17 20 C 18 20 19 20.8 19 22 L 19 14 L 28 12 L 28 17 L 21 18.5 L 21 24 C 20 23.5 19 23.5 17 24 Z" fill="#FFFFFF" filter="url(#softPinkGlow)" />
  </g>

  <!-- Floating Audio Spark Pill -->
  <g transform="translate(112, 115)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="60" height="22" rx="11" fill="#2D0616" stroke="#FB7185" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Audio Wave Lines inside pill -->
    <path d="M 12 11 L 18 11 M 22 7 L 22 15 M 26 5 L 26 17 M 30 8 L 30 14 M 34 6 L 34 16 M 38 9 L 38 13 M 44 11 L 48 11" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Radiant Neon Sparkles -->
  <g fill="#FFF1F2" filter="url(#softPinkGlow)">
    <path d="M 85 55 Q 92 55 92 48 Q 92 55 99 55 Q 92 55 92 62 Q 92 55 85 55 Z" />
    <path d="M 225 130 Q 230 130 230 125 Q 230 130 235 130 Q 230 130 230 135 Q 230 130 225 130 Z" fill="#FB7185" />
    <path d="M 390 35 Q 395 35 395 30 Q 395 35 400 35 Q 395 35 395 40 Q 395 35 390 35 Z" fill="#FDA4AF" />
  </g>

  <!-- Neon Glowing Plus Crosses -->
  <path d="M 60 115 L 60 127 M 54 121 L 66 121" stroke="#FB7185" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 395 160 L 395 172 M 389 166 L 401 166" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
</svg>
