<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#451A03" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#1C0A02" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070812" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1" />
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="wireframeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" fill="url(#avatarBg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="115" r="95" fill="#D97706" opacity="0.25" filter="url(#goldGlow)" />
  <circle cx="90" cy="170" r="60" fill="#EA580C" opacity="0.18" filter="url(#goldGlow)" />

  <!-- Holographic Concentric Biometric Rings -->
  <g transform="translate(280, 115)" opacity="0.25" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="4 6">
    <circle cx="0" cy="0" r="45" />
    <circle cx="0" cy="0" r="70" />
    <circle cx="0" cy="0" r="95" />
  </g>

  <!-- Central AI Avatar Figure (Stylized Holographic Indian Model / Presenter) -->
  <g transform="translate(245, 30)">
    <!-- Aura Shadow -->
    <ellipse cx="40" cy="90" rx="45" ry="70" fill="#B45309" opacity="0.3" filter="url(#goldGlow)" />

    <!-- Head & Hair Silhouette -->
    <circle cx="40" cy="45" r="22" fill="url(#avatarGrad)" />
    <!-- Traditional Bindi / Forehead Glow Mark -->
    <circle cx="40" cy="42" r="2" fill="#FFFFFF" filter="url(#wireframeGlow)" />
    
    <!-- Neck & Shoulders Form -->
    <path d="M 33 66 L 47 66 L 50 78 L 30 78 Z" fill="url(#avatarGrad)" />
    
    <!-- Royal Traditional Drape / Torso Silhouette with Gold Zari Accents -->
    <path d="M 8 135 C 8 95 24 82 40 82 C 56 82 72 95 72 135 L 72 165 L 8 165 Z" fill="url(#avatarGrad)" />
    
    <!-- Stylized Zari Embroidery Pattern Lines -->
    <path d="M 20 165 L 40 92 L 60 165" stroke="#FEF08A" stroke-width="2" stroke-opacity="0.8" />
    <path d="M 14 140 Q 40 120 66 140" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.7" fill="none" />
    <path d="M 12 155 Q 40 135 68 155" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.7" fill="none" />

    <!-- Facial Recognition Scanning Box (Wireframe Brackets) -->
    <g stroke="#FDE047" stroke-width="2" fill="none" filter="url(#wireframeGlow)">
      <!-- Top-Left -->
      <path d="M 12 30 L 12 20 L 22 20" />
      <!-- Top-Right -->
      <path d="M 68 20 L 78 20 L 78 30" />
      <!-- Bottom-Left -->
      <path d="M 12 60 L 12 70 L 22 70" />
      <!-- Bottom-Right -->
      <path d="M 68 70 L 78 70 L 78 60" />
      
      <!-- Central Focus Crosshair -->
      <path d="M 36 45 L 44 45 M 40 41 L 40 49" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Neural Mesh Nodes around head -->
    <circle cx="18" cy="24" r="2.5" fill="#FFFFFF" filter="url(#wireframeGlow)" />
    <circle cx="72" cy="24" r="2.5" fill="#FFFFFF" filter="url(#wireframeGlow)" />
    <circle cx="18" cy="66" r="2.5" fill="#FFFFFF" filter="url(#wireframeGlow)" />
    <circle cx="72" cy="66" r="2.5" fill="#FFFFFF" filter="url(#wireframeGlow)" />
  </g>

  <!-- Left Side Floating Vector Badges -->
  <!-- Floating Camera Aperture Bubble -->
  <g transform="translate(130, 50)" filter="url(#wireframeGlow)">
    <circle cx="22" cy="22" r="22" fill="#D97706" />
    <!-- Camera Aperture Hexagon -->
    <polygon points="22,12 31,17 31,27 22,32 13,27 13,17" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <circle cx="22" cy="22" r="4" fill="#FFFFFF" />
  </g>



  <!-- Gold Starbursts -->
  <path d="M 90 90 L 90 106 M 82 98 L 98 98" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" filter="url(#wireframeGlow)" />
  <path d="M 345 55 L 345 67 M 339 61 L 351 61" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 340 170 L 340 182 M 334 176 L 346 176" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" filter="url(#wireframeGlow)" />
</svg>
